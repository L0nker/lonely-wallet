services:
  lonely-wallet:
    image: lonker/lonely-wallet:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CHARTJS_DOWNLOAD_ATTEMPTS: "2"
    container_name: lonely-wallet
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - /srv/scripts/healthcheck.py
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    network_mode: bridge
    ports:
      - "8085:8080"
    environment:
      BRAPI_TOKEN: ""
      BRAPI_MAX_TICKERS_PER_REQUEST: "1"
      BRAPI_REQUEST_GAP_SECONDS: "0.35"
      PLUGGY_REQUEST_GAP_SECONDS: "1.0"
      ASSETS_DB_PATH: /data/ativos.db
      TOKEN_DB_PATH: /data/tokens.db
      USER_DB_PATH: /data/users.db
      DB_PATH: /data/carteira.db # caminho legado usado somente na migração inicial
      TZ: America/Sao_Paulo
    volumes:
      - /DATA/AppData/lonely-wallet/data:/data
    labels:
      icon: "/static/lonely-wallet-logo.png?v=6.1.16"
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: "1.00"
        reservations:
          memory: 256MB
          cpus: "0.00"

x-casaos:
  version: "6.1.16"
  hostname: ""
  architectures:
    - amd64
  author: Lonely Wallet
  category: Finance
  description:
    pt_BR: Carteira pessoal para acompanhar investimentos, posições e proventos.
    en_US: Personal investment portfolio dashboard.
  developer: Lonely Wallet
  icon: "/static/lonely-wallet-logo.png?v=6.1.16"
  index: /
  is_uncontrolled: false
  main: lonely-wallet
  port_map: "8085"
  scheme: http
  title:
    custom: Lonely Wallet
